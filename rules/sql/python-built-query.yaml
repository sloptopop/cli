rules:
  - id: sloptopop.sql.python-built-query
    languages: [python]
    severity: ERROR
    message: >-
      This SQL statement is built with `+`, `%`, `.format()` or an f-string
      and passed to a query call, so a value in it can change the statement
      (SQL injection). Pass the values as query parameters.
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      category: security
      confidence: MEDIUM
    patterns:
      - pattern: $DB.$METHOD($SQL, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(?:execute|executemany|executescript|exec_driver_sql|raw|mogrify|fetch|fetchrow|fetchval)$
      - metavariable-pattern:
          metavariable: $SQL
          patterns:
            - pattern-either:
                - pattern: '"..." + $VALUE'
                - pattern: '"..." % $VALUE'
                - pattern: '"...".format(...)'
                - pattern: 'f"...{$VALUE}..."'
            - pattern-not: '"..." + "..."'
      # The text starts like a SQL statement.
      - metavariable-regex:
          metavariable: $SQL
          regex: (?i)^[rbfu]{0,2}(?:"""|'''|"|')\s*(?:select|insert|update|delete|with|replace|merge|create|alter|drop|truncate)\b
